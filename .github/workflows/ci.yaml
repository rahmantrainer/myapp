name: CI

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/myapp:${{ github.sha }}

      - name: Update manifest
        run: |
          set -euo pipefail
          IMAGE="${{ vars.DOCKERHUB_USERNAME }}/myapp:${{ github.sha }}"
          sed -i "s|image: .*/myapp:.*|image: ${IMAGE}|" k8s/deployment.yaml

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet k8s/deployment.yaml; then
            echo "No change."
            exit 0
          fi

          git add k8s/deployment.yaml
          git commit -m "ci: bump image to ${{ github.sha }}"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
